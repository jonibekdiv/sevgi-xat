<style>

<script>
const NAME = "Charos";

const bg = document.getElementById('bg'), bctx = bg.getContext('2d');
const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
let W, H, DPR, S;
const TAU = Math.PI * 2;
const ease = t => t<0?0:t>1?1:1-Math.pow(1-t,3);
const easeBack = t => { t = Math.min(1, Math.max(0, t)); const c=1.5; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); };

/* ---------- background: nebula image + twinkling stars + parallax ---------- */
const bgImg = new Image(); bgImg.src = 'bg.jpg';
let stars = [], mx = .5, my = .5, pmx = .5, pmy = .5;
function makeStars(){
  const n = Math.round(W * H / 3800);
  stars = Array.from({length:n}, () => ({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.3+.3,
    p:Math.random()*TAU, s:.6+Math.random()*2.2, d:.3+Math.random()*.7}));
}
function drawBg(t){
  bctx.setTransform(DPR,0,0,DPR,0,0);
  pmx += (mx-pmx)*.04; pmy += (my-pmy)*.04;
  bctx.fillStyle = '#04040c'; bctx.fillRect(0,0,W,H);
  if (bgImg.complete && bgImg.naturalWidth){
    const z = 1.12 + Math.sin(t*.00005)*.03;
    const sc = Math.max(W/bgImg.naturalWidth, H/bgImg.naturalHeight)*z;
    const iw = bgImg.naturalWidth*sc, ih = bgImg.naturalHeight*sc;
    const ox = (W-iw)/2 - (pmx-.5)*40*S + Math.sin(t*.00007)*14*S;
    const oy = (H-ih)/2 - (pmy-.5)*30*S;
    bctx.drawImage(bgImg, ox, oy, iw, ih);
  }
  // readability veil
  const g = bctx.createRadialGradient(W/2,H*.45,0,W/2,H*.45,Math.max(W,H)*.75);
  g.addColorStop(0,'rgba(6,3,12,.30)'); g.addColorStop(1,'rgba(3,2,8,.62)');
  bctx.fillStyle = g; bctx.fillRect(0,0,W,H);
  for (const s of stars){
    const a = Math.pow(.5 + .5*Math.sin(t*.001*s.s + s.p), 3);
    const x = s.x - (pmx-.5)*60*S*s.d, y = s.y - (pmy-.5)*40*S*s.d;
    bctx.globalAlpha = a*.9; bctx.fillStyle = '#fff';
    bctx.beginPath(); bctx.arc(x, y, s.r*(.6+a*.6), 0, TAU); bctx.fill();
    if (a > .85 && s.r > 1.1){ bctx.globalAlpha = (a-.85)*3; bctx.fillRect(x-s.r*4, y-.4, s.r*8, .8); bctx.fillRect(x-.4, y-s.r*4, .8, s.r*8); }
  }
  bctx.globalAlpha = 1;
}

/* ---------- sampling ---------- */
const off = document.createElement('canvas'), octx = off.getContext('2d', {willReadFrequently:true});
function sample(drawFn, step, colorFn){
  off.width = W; off.height = H;
  octx.clearRect(0,0,W,H); drawFn(octx);
  const d = octx.getImageData(0,0,W,H).data, pts = [];
  for (let y=0; y<H; y+=step) for (let x=0; x<W; x+=step){
    const i = (y*W + x)*4;
    if (d[i+3] > 120){ const c = colorFn(x,y,d[i],d[i+1],d[i+2]);
      pts.push({x:x+(Math.random()-.5)*step*.6, y:y+(Math.random()-.5)*step*.6, c:c.c, heart:!!c.heart}); }
  }
  return pts;
}
function fit(pts, n){
  if (!pts.length) return [];
  const a = pts.slice(); for (let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}
  const out = []; for (let i=0;i<n;i++) out.push(a[i % a.length]); return out;
}

/* ---------- 3D rose model (unit radius) ---------- */
function roseModel(n){
  const pts = [];
  const nb = Math.round(n*.80), ns = Math.round(n*.08), nl = n - nb - ns;
  const LAYERS = 6;
  for (let i=0;i<nb;i++){
    const L = Math.floor(Math.pow(Math.random(), .8)*LAYERS), lf = L/(LAYERS-1);
    const P = 3 + L, j = (Math.random()*P)|0;
    const phi = j*TAU/P + L*1.13;
    const w = Math.PI/P*1.7;
    const h = 1 - Math.pow(Math.random(), 1.3);          // bias to petal rim
    let s = Math.random()*2-1;
    const width = Math.sin(Math.PI*Math.min(1, h*1.05+.08));
    const ang = phi + s*w*(.6+.4*h)*Math.max(.3, width);
    const Rl = .34 + .13*L;
    const th = Math.PI*(.12 + h*(.78 - .32*lf));      // sphere arc: inner petals close, outer open
    let r = Rl*Math.sin(th)*(1 - .05*Math.abs(s));
    const y = -.45 + Rl*Math.cos(th)*.92 - (h>.9 ? (h-.9)*lf*.4 : 0);
    const col = lf < .2 ? [255,225,240] : lf < .45 ? [255,140,195] : lf < .75 ? [250,80,160] : [215,40,120];
    const rim = h > .85 ? 1.25 : 1;
    pts.push({x:Math.cos(ang)*r, y, z:Math.sin(ang)*r, c:col.map(v=>Math.min(255,v*rim)), bloom:true});
  }
  // stem
  for (let i=0;i<ns;i++){
    const t = Math.random();
    pts.push({x:Math.sin(t*2.4)*.07, y:.28 + t*2.2, z:Math.cos(t*1.7)*.05 - .05, c:[70,230,165]});
  }
  // leaves + sepals
  const leaves = [{a:.35, at:1.15, len:.75}, {a:Math.PI+.7, at:1.55, len:.65}];
  for (let i=0;i<nl;i++){
    if (i < nl*.18){ // sepals under bloom
      const a = Math.random()*TAU, u = Math.random();
      pts.push({x:Math.cos(a)*(.12+u*.28), y:.3+u*.12 + u*u*.15, z:Math.sin(a)*(.12+u*.28), c:[60,215,150]}); continue;
    }
    const lf = leaves[i%2], u = Math.random(), v = Math.random()*2-1;
    const wd = Math.sin(Math.PI*u)*.2;
    const dx = Math.cos(lf.a), dz = Math.sin(lf.a);
    const along = u*lf.len, side = v*wd;
    pts.push({x:dx*along - dz*side, y:lf.at - u*.32 + u*u*.22 + Math.abs(v)*.03, z:dz*along + dx*side,
      c: Math.abs(v)<.12 ? [140,255,200] : [55,205,140]});
  }
  return pts;
}

/* ---------- layout / targets ---------- */
let N, envT, discR, nameT, roseT, rose3, roseR, roseC, stemBase, textBox, nameSmallY;
function layout(){
  const ew = Math.min(W*.78, 520*S), eh = ew*.62;
  const cx = W/2, cy = H*.42;
  const env = sample(c => {
    c.strokeStyle = '#ffd7a8'; c.lineWidth = Math.max(2, 3*S); c.lineJoin='round';
    const x0=cx-ew/2, y0=cy-eh/2;
    c.strokeRect(x0,y0,ew,eh);
    c.beginPath(); c.moveTo(x0,y0); c.lineTo(cx,cy+eh*.08); c.lineTo(x0+ew,y0); c.stroke();
    c.beginPath(); c.moveTo(x0,y0+eh); c.lineTo(cx-ew*.12,cy+eh*.12); c.moveTo(x0+ew,y0+eh); c.lineTo(cx+ew*.12,cy+eh*.12); c.stroke();
    c.font = `${Math.round(ew*.075)}px 'Press Start 2P', monospace`; c.textAlign='center'; c.textBaseline='middle';
    const tw = c.measureText('FOR YOU').width, th = ew*.075, ty = cy+eh*.3;
    textBox = {x0:cx-tw/2-ew*.03, x1:cx+tw/2+ew*.03, y0:ty-th*.9, y1:ty+th*.9};
    c.globalCompositeOperation = 'destination-out';
    c.fillRect(textBox.x0, textBox.y0, textBox.x1-textBox.x0, textBox.y1-textBox.y0);
    c.globalCompositeOperation = 'source-over';
    c.fillStyle = '#ff6fa3';
    const hs = ew*.045, hx = cx, hy = cy+eh*.02;
    c.beginPath(); c.moveTo(hx,hy+hs*1.1);
    c.bezierCurveTo(hx-hs*2.2,hy-hs*.2,hx-hs*1.1,hy-hs*1.9,hx,hy-hs*.7);
    c.bezierCurveTo(hx+hs*1.1,hy-hs*1.9,hx+hs*2.2,hy-hs*.2,hx,hy+hs*1.1); c.fill();
    c.fillStyle = '#ffffff'; c.fillText('FOR YOU', cx, ty);
  }, Math.max(2, Math.round(2.6*S)), (x,y,r,g,b) => r>240&&g>240 ? {c:[255,250,245]} : (g<150 ? {c:[255,110,165], heart:true} : {c:[255,214,168]}));
  envT = env;
  envT.heartC = {x:cx, y:cy+eh*.0};
  const dust = [];
  while (dust.length < env.length*.3){
    const x = cx-ew/2+Math.random()*ew, y = cy-eh/2+Math.random()*eh;
    if (x>textBox.x0 && x<textBox.x1 && y>textBox.y0 && y<textBox.y1) continue;
    dust.push({x, y, c:[255,200,160], faint:true});
  }
  N = Math.min(7000, Math.max(4500, Math.round(env.length*1.4)));
  const hc = envT.heartC;
  envT = fit(env.concat(dust), N); envT.heartC = hc;

  discR = Math.min(W*.44, 400*S);

  const fs = Math.min(W/(NAME.length*.40+1), 210*S);
  nameT = fit(sample(c => {
    c.fillStyle='#fff'; c.font = `${Math.round(fs)}px 'Great Vibes', cursive`; c.textAlign='center'; c.textBaseline='middle';
    c.fillText(NAME, cx, H*.45);
  }, Math.max(2, Math.round(1.6*S)), () => ({c:[255, 150+Math.random()*60|0, 195+Math.random()*40|0]})), N);

  // rose geometry on screen
  roseR = Math.min(W*.27, 125*S, H*.13);
  roseC = {x:cx, y:H*.30};
  stemBase = roseC.y + roseR*2.48;
  const fs2 = Math.min(W/(NAME.length*.42+1), 96*S);
  nameSmallY = stemBase + 44*S + fs2*.75;
  const n3 = Math.round(N*.66);
  rose3 = roseModel(n3);
  const small = sample(c => {
    c.fillStyle='#fff'; c.font = `${Math.round(fs2)}px 'Great Vibes', cursive`; c.textAlign='center'; c.textBaseline='middle';
    c.fillText(NAME, cx, nameSmallY);
  }, Math.max(2, Math.round(1.5*S)), () => ({c:[255,210,230]}));
  roseT = rose3.map(p => ({x:roseC.x, y:roseC.y, c:p.c, m3:p})).concat(fit(small, N - n3));

  document.getElementById('intro').style.top = (cy + eh/2 + 26*S) + 'px';
  document.getElementById('final').style.top = (stemBase + 18*S) + 'px';
}

/* ---------- particles ---------- */
let P = [];
function initParticles(){
  P = envT.map((t,i) => ({x:Math.random()*W, y:Math.random()*H, vx:0, vy:0, tx:t.x, ty:t.y,
    c:[255,255,255], tc:t.c, faint:!!t.faint, heart:t.heart, a:Math.random()*TAU, r:Math.random(), i,
    ch:'.:*+#%@&8$'[(Math.random()*10)|0], tw:Math.random()*TAU, depth:1}));
}
function retarget(arr){
  for (let i=0;i<P.length;i++){ const t = arr[i], p = P[i];
    p.tx=t.x; p.ty=t.y; p.tc=t.c; p.faint=!!t.faint; p.heart=!!t.heart; p.m3=t.m3||null; p.depth=1; }
}

/* ---------- rose rotation by pointer ---------- */
let rotY = .4, rotX = .3, spin = 0, tiltT = .3, lastPX = null, dragging = false;
function onMove(x, y, isTouch){
  mx = x/W; my = y/H;
  if (lastPX !== null && (!isTouch || dragging)) spin += (x - lastPX) * (isTouch ? .0011 : .00055);
  lastPX = x;
  tiltT = .3 + (my - .5) * .45;
  sparkle(x, y);
}
addEventListener('pointermove', e => onMove(e.clientX, e.clientY, e.pointerType === 'touch'), {passive:true});
addEventListener('pointerdown', e => { dragging = true; lastPX = e.clientX; });
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointerleave', () => { lastPX = null; });

/* cursor sparkles + floating hearts */
let sparks = [];
function sparkle(x, y){
  if (sparks.length > 160) return;
  for (let k=0;k<2;k++) sparks.push({x, y, vx:(Math.random()-.5)*1.2, vy:(Math.random()-.5)*1.2-.3, life:1,
    s:Math.random()*2+1, c:Math.random()<.5 ? '255,170,210' : '255,235,200'});
}
let hearts = [];
function spawnHeart(){
  hearts.push({x:Math.random()*W, y:H+20, vy:-(.3+Math.random()*.6)*S, sw:Math.random()*TAU, s:(10+Math.random()*14)*S, a:0, life:1});
}

/* ---------- state machine ---------- */
let phase = 'envelope', phaseStart = 0, ascii = false;
function setPhase(p, now){ phase = p; phaseStart = now; }

function openLetter(){
  if (phase !== 'envelope') return;
  document.getElementById('intro').classList.add('hide');
  setPhase('opening', performance.now());
  if (!audioOn) toggleSound(true);
  chime();
}

function update(now){
  const t = now - phaseStart, cx = W/2;
  if (phase === 'opening' && t > 650){
    for (const p of P){ const a=Math.random()*TAU, s=3+Math.random()*9; p.vx+=Math.cos(a)*s; p.vy+=Math.sin(a)*s;
      p.tc = [255, 90+Math.random()*120|0, 160+Math.random()*70|0]; p.faint=false; p.heart=false; }
    setPhase('vortex', now);
  } else if (phase === 'vortex'){
    const cy = H*.45, spd = .0016 + Math.min(t, 2600)*.0000009;
    for (const p of P){
      const rr = discR*(.05 + .95*Math.sqrt(p.r));
      const arm = (p.i % 2) * Math.PI;
      const ang = arm + (rr/discR)*4.2 + t*spd*(1.5 - p.r*.7) + (p.a-Math.PI)*.28;
      p.tx = cx + Math.cos(ang)*rr; p.ty = cy + Math.sin(ang)*rr*.36;
      const k = p.r; p.tc = k < .12 ? [255,240,250] : k < .5 ? [255,120,195] : [200,90,255];
    }
    if (t > 2900){ retarget(nameT); setPhase('name', now); }
  } else if (phase === 'name'){
    if (t > 3700){ retarget(roseT); setPhase('rose', now); }
  } else if (phase === 'rose'){
    if (t > 1400) document.getElementById('final').classList.add('show');
    if (t > 4000) document.getElementById('replay').classList.add('show');
    if (Math.random() < .05) spawnHeart();
  }

  // rose rotation
  spin *= .95; rotY += .0045 + spin; rotX += (tiltT - rotX)*.05;
  const cy_ = Math.cos(rotY), sy_ = Math.sin(rotY), cx_ = Math.cos(rotX), sx_ = Math.sin(rotX);
  const grow = phase === 'rose' ? easeBack((now - phaseStart)/2300) : 0;
  const breathe = 1 + Math.sin(now*.0013)*.02;
  const R = roseR, D = 4.2;

  const k = phase==='vortex' ? .06 : phase==='rose' ? .075 : .045;
  const damp = phase==='vortex' ? .86 : .80;
  const hc = envT.heartC, pulse = phase==='opening' ? 1 + ease((now-phaseStart)/650)*.7 : 1 + Math.pow(Math.max(0,Math.sin(now*.004)),8)*.18;
  for (const p of P){
    let tx = p.tx, ty = p.ty;
    if (phase === 'envelope' || phase === 'opening'){
      if (p.heart){ tx = hc.x + (p.tx-hc.x)*pulse; ty = hc.y + (p.ty-hc.y)*pulse; }
      const j = phase==='opening' ? ease((now-phaseStart)/650)*3*S : .8;
      tx += Math.sin(now*.0015 + p.tw)*j + (phase==='opening' ? (Math.random()-.5)*j : 0);
      ty += Math.cos(now*.0013 + p.tw)*j;
    }
    if (phase === 'rose' && p.m3){
      const m = p.m3;
      // grow upwards from stem base: scale model around stem foot
      const g = Math.max(.001, grow), bs = m.bloom ? breathe : 1;
      let x = m.x*bs, y = m.y*bs, z = m.z*bs;
      y = 2.48 + (y - 2.48)*g; x *= g; z *= g;
      // rotate Y then X (around bloom centre)
      y -= 1.2; // pivot at middle of the flower
      let x1 = x*cy_ + z*sy_, z1 = -x*sy_ + z*cy_;
      let y1 = y*cx_ - z1*sx_, z2 = y*sx_ + z1*cx_;
      const f = D/(D + z2);
      tx = roseC.x + x1*R*f; ty = roseC.y + (y1*f + 1.2)*R;
      p.depth = .45 + .55*Math.min(1, Math.max(0, (1.2 - z2)/2.4));
    }
    p.vx = (p.vx + (tx - p.x)*k)*damp;
    p.vy = (p.vy + (ty - p.y)*k)*damp;
    p.x += p.vx; p.y += p.vy;
    for (let j=0;j<3;j++) p.c[j] += (p.tc[j]-p.c[j])*.05;
  }
  for (const s of sparks){ s.x+=s.vx; s.y+=s.vy; s.vy+=.02; s.life-=.025; }
  sparks = sparks.filter(s => s.life > 0);
  for (const h of hearts){ h.y += h.vy; h.sw += .02; h.a = Math.min(1, h.a+.01); if (h.y < -30) h.life = 0; }
  hearts = hearts.filter(h => h.life > 0);
}

function draw(now){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // motion trails
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = `rgba(0,0,0,${phase==='vortex' ? .2 : phase==='rose' ? .42 : .34})`;
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation = 'lighter';
  const sz = Math.max(1.5, 2*S);
  if (ascii){ ctx.font = `${Math.round(7*S+3)}px 'JetBrains Mono', monospace`; ctx.textAlign='center'; ctx.textBaseline='middle'; }
  const wave = phase === 'name';
  for (const p of P){
    let tw = .55 + .45*Math.sin(now*.004 + p.tw);
    if (wave) tw *= .65 + .5*Math.max(0, Math.sin(p.x*.012 - now*.005));
    const a = (p.faint ? .2 : 1) * tw * p.depth;
    ctx.fillStyle = `rgba(${p.c[0]|0},${p.c[1]|0},${p.c[2]|0},${a})`;
    if (ascii) ctx.fillText(p.ch, p.x, p.y);
    else { const s = p.m3 ? sz*(.7+p.depth*.5) : sz; ctx.fillRect(p.x, p.y, s, s); }
  }
  if (!ascii){
    for (let i=0;i<P.length;i+=5){ const p = P[i]; if (p.faint) continue;
      ctx.fillStyle = `rgba(${p.c[0]|0},${p.c[1]|0},${p.c[2]|0},${.08*p.depth})`;
      ctx.beginPath(); ctx.arc(p.x,p.y,5.5*S,0,TAU); ctx.fill(); }
  }
  // rose aura
  if (phase === 'rose'){
    const g = ease((now-phaseStart)/2000);
    const rg = ctx.createRadialGradient(roseC.x, roseC.y, 0, roseC.x, roseC.y, roseR*2.2);
    rg.addColorStop(0, `rgba(255,90,170,${.16*g})`); rg.addColorStop(1, 'rgba(255,90,170,0)');
    ctx.fillStyle = rg; ctx.fillRect(roseC.x-roseR*2.2, roseC.y-roseR*2.2, roseR*4.4, roseR*4.4);
  }
  for (const s of sparks){
    ctx.fillStyle = `rgba(${s.c},${s.life*.9})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.s*s.life, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for (const h of hearts){
    ctx.globalAlpha = h.a * .55 * Math.min(1, h.y/(H*.3));
    ctx.fillStyle = '#ff7eb6'; ctx.font = `${h.s}px serif`;
    ctx.fillText('♥', h.x + Math.sin(h.sw)*14*S, h.y);
  }
  ctx.globalAlpha = 1;
}

function loop(now){ drawBg(now); update(now); draw(now); requestAnimationFrame(loop); }

function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = innerWidth; H = innerHeight; S = Math.max(.55, Math.min(1.4, Math.min(W, H*1.3)/900));
  for (const c of [bg,cv]){ c.width = W*DPR; c.height = H*DPR; }
  makeStars(); layout();
  const map = {envelope:envT, opening:envT, name:nameT, rose:roseT};
  if (!P.length) initParticles();
  else if (map[phase]) retarget(map[phase]);
}

/* ---------- sound (WebAudio music box) ---------- */
let actx, master, audioOn = false, seqTimer;
const notes = [0,4,7,12, 7,4, 2,5,9,14, 9,5, -3,0,4,9, 4,0, -1,2,7,11, 7,2];
function tone(f, when, dur, vol){
  const o = actx.createOscillator(), g = actx.createGain(), o2 = actx.createOscillator(), g2 = actx.createGain();
  o.type='sine'; o.frequency.value=f; o2.type='sine'; o2.frequency.value=f*2;
  g.gain.setValueAtTime(0,when); g.gain.linearRampToValueAtTime(vol,when+.01); g.gain.exponentialRampToValueAtTime(.0001,when+dur);
  g2.gain.setValueAtTime(0,when); g2.gain.linearRampToValueAtTime(vol*.25,when+.01); g2.gain.exponentialRampToValueAtTime(.0001,when+dur*.6);
  o.connect(g).connect(master); o2.connect(g2).connect(master);
  o.start(when); o2.start(when); o.stop(when+dur); o2.stop(when+dur);
}
function startSeq(){
  let i = 0, next = actx.currentTime + .1;
  const base = 523.25, step = .32;
  clearInterval(seqTimer);
  seqTimer = setInterval(() => {
    while (next < actx.currentTime + .4){
      tone(base*Math.pow(2, notes[i%notes.length]/12), next, 1.6, .09);
      if (i%6===0) tone(base/2*Math.pow(2, notes[i%notes.length]/12), next, 2.4, .06);
      next += step; i++;
    }
  }, 100);
}
function chime(){ if (!audioOn) return; const n=actx.currentTime; [0,4,7,12,16].forEach((s,i)=>tone(784*Math.pow(2,s/12), n+i*.07, 1.4, .07)); }
function toggleSound(force){
  const want = typeof force === 'boolean' ? force : !audioOn;
  if (want){
    if (!actx){ actx = new (window.AudioContext||window.webkitAudioContext)(); master = actx.createGain(); master.gain.value = .8;
      const d = actx.createDelay(); d.delayTime.value=.28; const fb = actx.createGain(); fb.gain.value=.32;
      master.connect(actx.destination); master.connect(d); d.connect(fb).connect(d); d.connect(actx.destination); }
    actx.resume(); startSeq(); audioOn = true;
  } else { clearInterval(seqTimer); audioOn = false; }
  document.getElementById('soundBtn').classList.toggle('on', audioOn);
}


/* ---------- UI ---------- */
document.getElementById('open').addEventListener('click', e => { e.stopPropagation(); openLetter(); });
cv.addEventListener('click', openLetter);
document.getElementById('soundBtn').addEventListener('click', () => toggleSound());
document.getElementById('asciiBtn').addEventListener('click', e => { ascii = !ascii; e.currentTarget.classList.toggle('on', ascii); });
const qrModal = document.getElementById('qrModal');
document.getElementById('qrBtn').addEventListener('click', () => qrModal.classList.add('show'));
document.getElementById('qrClose').addEventListener('click', () => qrModal.classList.remove('show'));
qrModal.addEventListener('click', e => { if (e.target === qrModal) qrModal.classList.remove('show'); });
document.getElementById('replay').addEventListener('click', () => {
  document.getElementById('final').classList.remove('show');
  document.getElementById('replay').classList.remove('show');
  document.getElementById('intro').classList.remove('hide');
  for (const p of P){ const a=Math.random()*TAU; p.vx+=Math.cos(a)*8; p.vy+=Math.sin(a)*8; }
  retarget(envT); setPhase('envelope', performance.now());
});
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 150); });
(document.fonts ? document.fonts.load("40px 'Great Vibes'").then(()=>document.fonts.load("20px 'Press Start 2P'")) : Promise.resolve())
  .catch(()=>{}).finally(() => { resize(); requestAnimationFrame(loop); });
</script>
